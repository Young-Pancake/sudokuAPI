[project]
name = "sudokuapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.fastapi]
entrypoint = "sudokuapi.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"